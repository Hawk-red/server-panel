<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0f172a" />
<title>Нет связи с панелью</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#e2e8f0;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  main{max-width:360px}
  img{width:72px;height:72px;border-radius:16px}
  h1{font-size:20px;margin:16px 0 8px}
  p{color:#94a3b8;margin:0 0 20px}
  button{background:#22c55e;color:#052e16;border:0;border-radius:8px;padding:10px 20px;font:inherit;font-weight:600}
</style>
</head>
<body>
<main>
  <img src="/images/icon-192.png" alt="" />
  <h1>Нет связи с панелью</h1>
  <p>Проверьте, что вы дома (в сети Wi-Fi) или подключены по VPN (WireGuard).</p>
  <button onclick="location.reload()">Повторить</button>
</main>
<script>addEventListener('online',()=>location.reload())</script>
</body>
</html>
