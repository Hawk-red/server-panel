# /etc/fail2ban/filter.d/panel-auth.conf — неудачные попытки входа в панель (https://panel.pulsdev.net).
# Формат лога nginx — combined: $remote_addr - $remote_user [время] "запрос" статус размер "referer" "user-agent".
# Считаются только POST на /api/auth/ со статусами 401 (неверный пароль/код), 403 (вход закрыт или нет 2FA), 429 (блокировка/лимит).
# GET /api/auth/me и /info не считаются: их делает любая открытая страница входа (401 для гостя — норма).
# Внутренние адреса в бан не попадают: их исключает ignoreip в jail.
[Definition]
failregex = ^<HOST> .*"POST /api/auth/[A-Za-z0-9_/-]* HTTP/[0-9.]+" (?:401|403|429) 
ignoreregex =
