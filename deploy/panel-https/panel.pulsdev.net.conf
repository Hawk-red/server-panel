# /etc/nginx/sites-available/panel.pulsdev.net — панель сервера по HTTPS (источник: /opt/server-panel/deploy/panel-https/)
# Только LAN и WireGuard: у роутера 9443 → 443, поэтому хост виден из интернета, и запрещён он здесь, на уровне server.
# allow/deny работают по адресу соединения ($remote_addr); модуль realip НЕ подключён, поэтому подменить адрес
# заголовком X-Forwarded-For нельзя.

# Для WebSocket: Connection зависит от Upgrade (панель сама их не использует, но потоки и обновления не сломаются)
map $http_upgrade $panel_conn_upgrade {
    default upgrade;
    ''      '';
}

# http://panel.pulsdev.net → https (тот же доступ только для LAN/VPN; не default_server)
server {
    listen 80;
    server_name panel.pulsdev.net;

    allow 192.168.31.0/24;
    allow 10.10.10.0/24;
    allow 127.0.0.1;
    deny  all;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name panel.pulsdev.net;

    ssl_certificate     /etc/letsencrypt/live/panel.pulsdev.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.pulsdev.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ВАЖНО: доступ только из домашней сети и VPN; остальным (в том числе из интернета через 9443) — 403
    allow 192.168.31.0/24;
    allow 10.10.10.0/24;
    allow 127.0.0.1;
    deny  all;

    access_log /var/log/nginx/panel.access.log;
    error_log  /var/log/nginx/panel.error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "same-origin" always;

    location / {
        # эти два заголовка панель тоже ставит сама: оставляем один экземпляр (nginx), без дублей
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;

        proxy_pass http://127.0.0.1:7575;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # именно $remote_addr, без дописывания присланного клиентом заголовка: панель верит этому значению
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $panel_conn_upgrade;

        # потоки (ответы локального AI) идут без буферизации; долгие запросы не обрываются
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
