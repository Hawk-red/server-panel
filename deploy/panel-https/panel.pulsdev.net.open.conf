# /etc/nginx/sites-available/panel.pulsdev.net — ВАРИАНТ ДЛЯ ДОСТУПА ИЗ ИНТЕРНЕТА (https://panel.pulsdev.net:9443).
# Источник: /opt/server-panel/deploy/panel-https/. Включает open-external.sh, возвращает закрытый вариант close-external.sh.
# Отличие от panel.pulsdev.net.conf: нет `deny all` на 443, добавлены лимиты запросов и соединений. Защита остальная — в самой панели:
# двухфакторный вход, блокировки IP, запрет опасных действий снаружи, короткая внешняя сессия.
# Адрес клиента в панель передаётся как X-Forwarded-For = $remote_addr (ПЕРЕЗАПИСЬ, не дописывание); модуль realip не подключён.

map $http_upgrade $panel_conn_upgrade {
    default upgrade;
    ''      '';
}

# Лимиты по IP: вход — 10 запросов в минуту (пачка до 5), остальной API — мягкий (120 в минуту, пачка 60), одновременных запросов — 100.
# Домашняя сеть, VPN и сам сервер лимитам не подчиняются (пустой ключ = без лимита), иначе обычная работа панели упёрлась бы в них.
geo $panel_internal {
    default           0;
    192.168.31.0/24   1;
    10.10.10.0/24     1;
    127.0.0.1         1;
}
map $panel_internal $panel_limit_key {
    1       '';
    default $binary_remote_addr;
}
limit_req_zone  $panel_limit_key zone=panel_auth:10m rate=10r/m;
limit_req_zone  $panel_limit_key zone=panel_api:10m  rate=120r/m;
limit_conn_zone $panel_limit_key zone=panel_conn:10m;

# Порт 9443 на самом сервере — только для панели: запросы с чужим именем (SNI) отвергаются на рукопожатии, а не отдаются панели.
# Внешние клиенты api.pulsdev.net:9443 (SFTPGo) приходят на 443 через проброс роутера и этого блока не касаются.
server {
    listen 9443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}

# http → https только для домашней сети (порт 80 наружу не пробрасывается; не default_server)
server {
    listen 80;
    server_name panel.pulsdev.net;

    allow 192.168.31.0/24;
    allow 10.10.10.0/24;
    allow 127.0.0.1;
    deny  all;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    # 9443 — тот же адрес, что снаружи (роутер 9443 → 443 сервера), но и дома: https://panel.pulsdev.net:9443 открывается везде одинаково
    listen 9443 ssl http2;
    server_name panel.pulsdev.net;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/panel.pulsdev.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.pulsdev.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/panel.access.log;
    error_log  /var/log/nginx/panel.error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "same-origin" always;

    # По HTTP/2 каждый запрос — отдельный поток, а страница панели грузит десятки файлов сразу: 30 тут рвало загрузку (429 на скриптах)
    limit_conn panel_conn 100;
    limit_conn_status 429;
    limit_req_status  429;

    # Тела запросов панели маленькие (в самой панели лимит 64 КБ)
    client_max_body_size 64k;

    # Общие настройки прокси наследуются всеми location ниже (в них только proxy_pass и лимиты)
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $panel_conn_upgrade;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_buffering    off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Вход: жёсткий лимит и крошечное тело (пароль + код). Только сам вход: /api/auth/me и /info вызываются при каждой странице
    location = /api/auth/login {
        limit_req zone=panel_auth burst=5 nodelay;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:7575;
    }

    location /api/ {
        limit_req zone=panel_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:7575;
    }

    location / {
        proxy_pass http://127.0.0.1:7575;
    }
}
