# /etc/nginx/snippets/exchange-public.conf — публичный веб-клиент обменника; подключается в server 443 у api.pulsdev.net
# Снаружи: https://api.pulsdev.net:9443/files/ (роутер 9443→443). Из дома: https://api.pulsdev.net/files/ (запись в AdGuard).

# Не индексировать
location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
}

location = /files {
    absolute_redirect off;
    return 301 /files/;
}

location /files/ {
    access_log /var/log/nginx/exchange.access.log exchange if=$exchange_loggable;

    client_max_body_size 10G;          # лимит одного файла (в SFTPGo у гостя такой же)
    proxy_request_buffering off;       # тело идёт напрямую, а не копится во временных файлах на SSD
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    limit_req zone=exchange_login burst=10 nodelay;
    limit_req_status 429;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;   # именно $remote_addr, без дописывания чужого заголовка
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $exchange_conn_upgrade;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;

    proxy_pass http://127.0.0.1:8080;
}
