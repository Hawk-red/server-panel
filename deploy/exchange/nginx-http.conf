# /etc/nginx/conf.d/exchange.conf — обменник файлов (SFTPGo): настройки уровня http
# Формат лога без query-строки (в ней бывают токены); по нему же работает fail2ban.
log_format exchange '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent';

# Ограничение частоты запросов к странице входа: у остальных запросов ключ пустой — они не считаются
map $request_uri $exchange_login_key {
    default "";
    "~^/files/web/client/login" $binary_remote_addr;
}
limit_req_zone $exchange_login_key zone=exchange_login:10m rate=20r/m;

# Статику интерфейса (шрифты, скрипты) в лог не пишем — только действия
map $uri $exchange_loggable {
    ~^/files/static/ 0;
    default          1;
}

map $http_upgrade $exchange_conn_upgrade {
    default upgrade;
    ''      close;
}
