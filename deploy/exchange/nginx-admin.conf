# /etc/nginx/sites-available/exchange-admin — админка SFTPGo: только LAN и VPN, HTTPS на порту 8443.
# Открывать: https://api.pulsdev.net:8443/files/web/admin/  (из дома имя ведёт на сервер через запись в AdGuard;
# по IP: https://192.168.31.112:8443/files/web/admin/ — браузер покажет предупреждение о сертификате).
server {
    listen 8443 ssl;
    server_name api.pulsdev.net;

    ssl_certificate     /etc/letsencrypt/live/api.pulsdev.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pulsdev.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    allow 192.168.31.0/24;
    allow 10.10.10.0/24;
    allow 127.0.0.1;
    deny  all;

    access_log /var/log/nginx/exchange-admin.access.log;
    client_max_body_size 50m;

    location = /files {
        absolute_redirect off;
        return 301 /files/;
    }

    location ~ ^/(files/|api/|healthz$) {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $exchange_conn_upgrade;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options SAMEORIGIN always;
        proxy_pass http://127.0.0.1:8082;
    }

    location / {
        return 404;
    }
}
