# Jellyfin — compose для обновления из панели, составлен по `docker inspect jellyfin` и сверен с сервисом jellyfin
# из /home/macmini/audio-streaming/docker-compose.yml (09.10.2026). Описание — то же самое, только пути абсолютные.
#
# Почему проект называется audio-streaming, а не jellyfin: в файле macmini этот сервис уже есть (вместе с minimserver и
# bubbleupnpserver). Второй проект с тем же container_name дал бы конфликт («name already in use») при любом `docker compose up`
# в папке macmini. В одном проекте контейнер принадлежит им обоим: `docker compose config --hash` у этого файла и у файла macmini
# совпадает, поэтому `up` в их папке ничего не пересоздаёт. Помощник панели трогает только этот сервис (`up -d --no-deps jellyfin`).
#
# Файл НЕ используется, пока его не установит deploy/docker/install-project.sh jellyfin (корневая копия в
# /etc/server-panel/docker/jellyfin/, хэш в белом списке). Подключение контейнер не трогает.
# Остальное окружение (JELLYFIN_*_DIR, HEALTHCHECK_URL, NVIDIA_*) и healthcheck приходят из образа.
# Защита от пустых каталогов вместо compose-опции: require_paths в project.json (иначе хэш разошёлся бы с файлом macmini).
name: audio-streaming

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    network_mode: host
    restart: unless-stopped
    environment:
      - TZ=Europe/Kyiv
      - JELLYFIN_PublishedServerUrl=http://192.168.31.112:8096
    volumes:
      - /home/macmini/audio-streaming/jellyfin-config:/config
      - /home/macmini/audio-streaming/jellyfin-cache:/cache
      - /mnt/flac-usb/music:/media/music:ro
